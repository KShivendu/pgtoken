# Settings for every paper benchmark, identical for every arm (text, int4[], bytea, pgtoken).
# Each value is set explicitly so SHOW reports what the paper says, not a version default.
# Sized for the smoke box (4 cores, 15 GB RAM). The full runs override shared_buffers and
# effective_cache_size with -c on the command line and record SHOW output in each run's config.

listen_addresses = '*'
max_connections = 100            # clients are 1..2x cores, far below this

# Memory. shared_buffers holds every smoke table (about 0.3 GB at 20k rows) so the cached runs
# read from shared memory; disk-bound runs set it small and drop the OS cache instead.
shared_buffers = 4GB
effective_cache_size = 8GB
work_mem = 64MB                  # per sort/hash node; the RAG query sorts nothing big
maintenance_work_mem = 2GB       # HNSW index build stays in memory; needs shm_size > this (compose: 4g)

# Write path. Loads use COPY; reads never wait on WAL. synchronous_commit = off removes a
# ~10 ms WAL flush per single-row INSERT, which would swamp every write difference.
synchronous_commit = off
wal_compression = off            # WAL bytes are a measured quantity, keep them raw
checkpoint_timeout = 30min
max_wal_size = 8GB

# Planner and executor. JIT off: it adds 10-100 ms of compile time to some plans at random
# and is off in most OLTP deployments. No parallel query: the RAG query is a k-row index scan,
# and a parallel plan would make 1-client latency depend on worker start-up.
jit = off
max_parallel_workers_per_gather = 0
random_page_cost = 1.1           # SSD

# TOAST: the server default for text. The lz4 arm sets COMPRESSION lz4 on its column.
default_toast_compression = pglz

# pgvector. ef_search is set per session by the benchmark (>= k, or HNSW returns < k rows).
hnsw.ef_search = 100


track_io_timing = on

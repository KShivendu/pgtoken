[package]
name = "pgtoken"
version = "0.1.0"
edition = "2021"
description = "Token-native storage for PostgreSQL: store text as BPE token IDs."
license = "Apache-2.0"
repository = "https://github.com/KShivendu/pgtoken"
# `<[T]>::as_chunks`, stable since 1.88.
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg14"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
# The o200k server tokenizer: the same regex engine and version tiktoken uses, so the
# pre-tokenizer (with its `\s+(?!\S)` lookahead) splits text identically.
fancy-regex = "0.13"
pgrx = "=0.19.2"
# All codec logic lives in the pgrx-free core crate, so it can be tested without a running
# Postgres and reused as the client-side decoder.
pgtoken-core = { path = "../core" }
rustc-hash = "2"
# Pure-Rust zstd decoder for the bundled presets (ext/presets/*.zst), so the build needs no
# C zstd library.
ruzstd = "0.8"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

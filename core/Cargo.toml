[package]
name = "pgtoken-core"
version = "0.1.0"
edition = "2021"
description = "Lossless compression for token-ID sequences."
license = "Apache-2.0"

# No pgrx dependency, so the codecs test without a running Postgres and the same crate can be
# linked by a client wanting to decode values it read out of the database.
#
# No tokenizer dependency either, deliberately: this crate compresses integer sequences and has
# no opinion about which vocabulary produced them.

[dependencies]
sha2 = "0.10"

# Only for the benchmarks in examples/: `leb_vs_svb.rs` (chose LEB128 over streamvbyte for
# `freq`) and `lz_on_freq.rs` (LZ compression on top of `freq`).
[dev-dependencies]
stream-vbyte = "0.4"
lz4_flex = "0.11"
zstd = { version = "0.13", features = ["experimental", "zdict_builder"] }
